<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Retrieve{% endblock %}</title>
  <!-- Bootstrap and fonts from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="site-nav">
    <div class="container d-flex align-items-center justify-content-between py-3 gap-3">
      <a class="brand" href="/">RETRIEVE</a>
      <div class="d-flex gap-3 flex-wrap">
        <a class="nav-tab {% if request.path == '/labs' %}active{% endif %}" href="/labs">labs</a>
<a class="nav-tab {% if request.path == '/match' %}active{% endif %}" href="/match">resume matches</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container py-4 small">
      Lab details come from public UMBC pages, so confirm with the lab before applying. Site is not affiliated with UMBC. 
    </div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
